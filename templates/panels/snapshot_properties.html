<div class="property-box" id="snapshot-properties">

    <h3>Snapshot Properties</h3>
    <br>

    <div class="properties-table">

        <div class="properties-header">
            <span>Property</span>
            <span>Value</span>
        </div>

        <div class="property-row">
            <span class="property-label">Name</span>
            <span class="property-value" id="snapshot-name"></span>
        </div>

        <div class="property-row">
            <span class="property-label">Repository</span>
            <span class="property-value" id="snapshot-repository"></span>
        </div>

        <div class="property-row">
            <span class="property-label">State</span>
            <span class="property-value" id="snapshot-state"></span>
        </div>

        <div class="property-row">
            <span class="property-label">Indices</span>
            <span class="property-value" id="snapshot-indices"></span>
        </div>

    </div>

</div>
