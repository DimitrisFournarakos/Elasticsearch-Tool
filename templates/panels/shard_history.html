<div id="shard-history-properties" class="property-box">

    <h2>Shard Growth History</h2>

    <br>

    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-title">Started Shards</div>
            <div class="metric-value" id="shard-started"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Relocating Shards</div>
            <div class="metric-value" id="shard-relocating"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Initializing Shards</div>
            <div class="metric-value" id="shard-initializing"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Unassigned Shards</div>
            <div class="metric-value" id="shard-unassigned"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Shard Health</div>
            <div class="metric-value" id="shard-history-health-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Total Events</div>
            <div class="metric-value" id="shard-total-events"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Availability</div>
            <div class="metric-value" id="shard-availability"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Trend</div>
            <div class="metric-value" id="shard-trend"></div>
        </div>

    </div>

    <hr>

    <br>

    <div class="history-filter-container">
        <label>Time Period:</label>

        <select id="shard-period" class="history-filter">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>

    <br>

    <h3>Shard Allocation History</h3>

    <div style="height:350px;">
        <canvas id="shardAllocationChart"></canvas>
    </div>

    <br>

    <h3>Shard Health History</h3>

    <div style="height:350px;">
        <canvas id="shardHealthChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Recent Events</h3>

    <br>

    <div class="history-events-box">

        <div id="shard-event-header">
            <span>Timestamp</span>
            <span>Changes</span>
            <span>Event</span>
        </div>

        <div id="shard-events"></div>

    </div>

</div>
