<div class="property-box" id="cluster-health-history-properties">

    <h2>Cluster Health History</h2>
    <br>

    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-title">Cluster</div>
            <div class="metric-value" id="history-cluster-name"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Live Cluster Status</div>
            <div class="metric-value" id="history-current-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Latest Recorded Event</div>
            <div class="metric-value" id="history-last-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Total Events</div>
            <div class="metric-value" id="history-total-events"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Availability</div>
            <div class="metric-value" id="history-availability"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Trend</div>
            <div class="metric-value" id="history-trend"></div>
        </div>

    </div>

    <hr>
    <br>

    <div class="history-filter-container">
        <label for="history-period">Time Period:</label>
        <select class="history-filter" id="history-period">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>

    <br>

    <h3>Health History</h3>

    <div style="height:400px;">
        <canvas id="clusterHealthChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Recent Events</h3>

    <br>

    <div class="history-events-box">

        <div id="health-event-header">
            <span>Timestamp</span>
            <span>Status</span>
            <span>Event</span>
        </div>

        <div id="health-events"></div>

    </div>

</div>
