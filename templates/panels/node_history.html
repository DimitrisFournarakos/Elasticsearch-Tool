<div class="property-box" id="node-history-properties">

    <h2>Node Growth History</h2>

    <br>

    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-title">Node</div>
            <div class="metric-value" id="node-history-name"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Usage</div>
            <div class="metric-value" id="node-current-usage"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Disk Status</div>
            <div class="metric-value" id="node-current-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Total Events</div>
            <div class="metric-value" id="node-total-events"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Availability</div>
            <div class="metric-value" id="node-availability"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Trend</div>
            <div class="metric-value" id="node-trend"></div>
        </div>

    </div>

    <hr>

    <br>

    <div class="history-filter-container">
        <label>Time Period:</label>

        <select id="node-period" class="history-filter">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>

    <br>

    <h3>Node Usage History</h3>

    <div style="height:400px;">
        <canvas id="nodeHistoryChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Recent Events</h3>

    <br>

    <div class="history-events-box">

        <div id="node-event-header">
            <span>Timestamp</span>
            <span>Usage</span>
            <span>Event</span>
        </div>

        <div id="node-events"></div>

    </div>

</div>
