<div class="property-box" id="cluster-storage-history-properties">

    <h2>Cluster Growth History</h2>
    <br>

    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-title">Cluster</div>
            <div class="metric-value" id="storage-cluster-name"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Usage</div>
            <div class="metric-value" id="storage-current-usage"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Disk Status</div>
            <div class="metric-value" id="storage-current-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Total Events</div>
            <div class="metric-value" id="storage-total-events"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Availability</div>
            <div class="metric-value" id="storage-availability"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Trend</div>
            <div class="metric-value" id="storage-trend"></div>
        </div>

    </div>

    <hr>
    <br>

    <div class="history-filter-container">
        <label for="storage-period">Time Period:</label>
        <select class="history-filter" id="storage-period">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>

    <br>

    <h3>Storage Usage History</h3>

    <div style="height:400px;">
        <canvas id="clusterStorageChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Recent Storage Events</h3>

    <br>

    <div class="history-events-box">

        <div id="storage-event-header">
            <span>Timestamp</span>
            <span>Usage</span>
            <span>Event</span>
        </div>

        <div id="storage-events"></div>

    </div>

</div>
