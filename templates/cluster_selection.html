<div class="tree-title">

    <span class="folder-label">
        📁 Elasticsearch
    </span>

    <span id="refresh-clusters-btn">

        <svg class="refresh-icon"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <path d="M21 2v6h-6"></path>
            <path d="M20.49 15A9 9 0 1 1 21 8"></path>

        </svg>

        <span class="refresh-tooltip">
            Refresh Clusters
        </span>

    </span>

</div>


<ul class="tree">

    <li class="folder">
        <span id="clusters-folder" class="folder-label">
            📁 Clusters
        </span>

        <ul id="cluster-list" class="child">
            
            
            {% for cluster in clusters %}
            <li class="cluster-item"
                data-id="{{ cluster.id }}"
                data-name="{{ cluster.name }}"
                data-url="{{  cluster.url }}"
                data-environment="{{ cluster.environment }}">

                <span class="node-label">
                    🌐 {{ cluster.name }}
                </span>

            </li>

            {% endfor %}
            
                <li class="cluster-add-item">
                    <button id="open-add-cluster" class="cluster-add-button">
                    <svg width="18"
     height="17"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     style="vertical-align:middle; position:relative; ">

    <ellipse cx="10" cy="5" rx="6" ry="3"></ellipse>

    <path d="M4 5v7c0 1.7 2.7 3 6 3s6-1.3 6-3V5"></path>

    <path d="M20 10v8"></path>
    <path d="M16 14h8"></path>

</svg>
                    <span>Add Cluster</span>
                    </button>
                </li>
            

        </ul>

    </li>
        

</ul>

<script>

document.addEventListener("DOMContentLoaded", function(){
    const clustersFolder = document.getElementById("clusters-folder");
    const clusterList = document.getElementById("cluster-list");
    
    window.hideAllProperties();
    
    clustersFolder.addEventListener("click", function(){
        
        //Με την if  ανοιγει-κλείνει τον εκαστοτε Cluster στο δεξί Panel
        //Αν υπάρχει η class open -> κλείστο , Αν δεν υπάρχει η class -> ανοιξέ το, αφορα και το .child.open{display:block;}
        if(clusterList.classList.contains("open")){
                clusterList.classList.remove("open");
        }else{
        clusterList.classList.add("open");

        }
    });
});

</script>
