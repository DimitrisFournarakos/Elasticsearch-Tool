<div class="property-box" id="add-cluster-properties">

    <h3>Add Cluster</h3>

    <br>

    <div class="properties-table">

        <div class="properties-header">
            <span>Property</span>
            <span>Value</span>
        </div>

        <div class="property-row">
            <span class="property-label">URL</span>
            <input
                type="text"
                id="form-cluster-url"
                placeholder="https://elastic-prod.company.com:9200">
        </div>

        <div class="property-row">
            <span class="property-label">Username</span>
            <input
                type="text"
                id="cluster-username"
                placeholder="Elasticsearch Username">
        </div>

        <div class="property-row">
            <span class="property-label">Password</span>
            <input
                type="password"
                id="cluster-password"
                placeholder="Elasticsearch Password">
        </div>

        <div class="property-row">
            <span class="property-label">Environment</span>

            <select id="form-cluster-environment" required>
                <option value="" selected hidden>Select Environment</option>

                <option value="production">Production</option>
                <option value="staging">Staging</option>
                <option value="qa">QA</option>
                <option value="development">Development</option>
                <option value="monitoring">Monitoring</option>
                <option value="sandbox">Sandbox</option>
                <option value="disaster-recovery">Disaster Recovery</option>

            </select>

        </div>

    </div>

    <br>

    <button
        class="form-button"
        id="validate-cluster-btn">
        Validate Connection
    </button>

    <button class="form-button form-button-save" id="save-cluster-btn" disabled>
        Add Cluster
    </button>

    <br><br>


    <div id="cluster-validation-result"></div>
            <div id="cluster-detected-info" class="cluster-detected-info" style="display:none;">
                <div class="detected-info-header">
                    ✅ Connection Successful
                </div>

                <div class="detected-info-grid">
                    <div class="detected-info-card">
                        <div class="detected-info-title">
                            Cluster Name
                        </div>

                        <div
                            class="detected-info-value"
                            id="detected-cluster-name">
                        </div>
                    </div>

                    <div class="detected-info-card">
                        <div class="detected-info-title">
                            Cluster URL
                        </div>

                        <div
                            class="detected-info-value"
                            id="detected-cluster-url">
                        </div>
                    </div>
                </div>

            </div>

            <div id="cluster-validation-error" class="cluster-validation-error" style="display:none;">
                <div class="validation-error-header">
                    ❌ Connection Failed
                </div>

                <div class="validation-error-message">
                    Unable to connect to the Elasticsearch cluster.

                    <br><br>
                    Please verify:
                    <ul>
                        <li>Cluster URL</li>
                        <li>Username</li>
                        <li>Password</li>
                        <li>Cluster Availability</li>
                    </ul>
                </div>
            </div>

            <div id="cluster-save-message" class="cluster-save-message" style="display:none;">

                <div id="cluster-save-header" class="cluster-save-header"></div>
                <div id="cluster-save-text" class="cluster-save-text"></div>

            </div>

        </div>


</div>
