<div class="property-box" id="index-history-properties">

    
    <h2>Index Growth History</h2>
    <br>
    <p><strong>Index:</strong> <span id="index-history-name"></span></p>
    <p><strong>Current Documents:</strong> <span id="index-current-docs"></span></p>
    <p><strong>Current Size:</strong> <span id="index-current-size"></span></p>
    <p><strong>Current Disk Status:</strong> <span id="index-current-status"></span></p>
    <p><strong>Total Events:</strong> <span id="index-total-events"></span></p>
    <p><strong>Documents Trend:</strong> <span id="index-docs-trend"></span></p>
    <p><strong>Storage Trend:</strong> <span id="index-size-trend"></span></p>
   
    <br>
    <hr>
    <br>

    <div class="history-filter-container">
        <label>Time Period:</label>
            <select id="index-period" class="history-filter">
                <option value="1h">Last Hour</option>
                <option value="24h" selected>Last 24 Hours</option>
                <option value="7d">Last 7 Days</option>
                <option value="30d">Last 30 Days</option>
                <option value="365d">Last 365 Days</option>
            </select>
    </div>

    <h3>Document Growth</h3>
    <div style="height:400px;"><canvas id="indexDocsChart"></canvas></div>

    <br>
    <hr>
    <br>

    
    <h3>Storage Growth</h3>
    <div style="height:400px;"><canvas id="indexSizeChart"></canvas></div>

    <br>
    <hr>
    <br>

    <h3>Recent Events</h3>
    <br>
    <div id="index-events" class="history-events-box"></div>

</div>
