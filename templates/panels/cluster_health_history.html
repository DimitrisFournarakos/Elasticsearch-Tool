<div class="property-box" id="cluster-health-history-properties">
    <h2>Cluster Health History</h2>
    <br>
    <p><strong>Cluster:</strong> <span id="history-cluster-name"> </span></p>
    <p><strong>Live Cluster Status:</strong> <span id="history-current-status"> </span></p>
    <p><strong>Latest Recorded Event:</strong> <span id="history-last-status"> </span></p>
    <p><strong>Total Events:</strong> <span id="history-total-events"> </span></p>
    <p><strong>Availability:</strong> <span id="history-availability"> </span></p>
    <p><strong>Trend:</strong> <span id="history-trend"> </span></p>
    <br>
    <hr>
    <br>
    <div class="history-filter-container">
        <label for="history-period">Time Period:</label>
        <select class="history-filter" id="history-period">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>
    <br>

    <h3>Health History</h3>
    <div style="height:400px;"><canvas id="clusterHealthChart"></canvas></div>
    <br>
    <hr>
    <br>
    <h3>Recent Events</h3>
    <br>
    <div class="history-events-box" id="health-events">
        /*Εδώ εμφανίζω τα Recent Events (2026-06-11 11:15:00 - GREEN)*/
    </div>

</div>
