<div id="cluster-properties" class="property-box">

    <div class="cluster-header">
        <h2>Cluster Information</h2> 
        <div class="cluster-header-icons">
            
            <button id="edit-cluster-btn" class="cluster-edit-icon">
                <svg width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
                </svg>

                <span class="refresh-tooltip">
                    Edit Cluster
                </span>
                <span class="refresh-tooltip">Edit Cluster</span>
            </button>

            <button id="delete-cluster-btn" class="cluster-delete-icon">
                <svg width="20"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                </svg>

                <span class="refresh-tooltip">Delete Cluster</span>
            </button>

        </div>
    </div>


    <br>

    <div class="properties-table">

            <div class="properties-header">
                <span>Property</span>
                <span>Value</span>
            </div>

            <div class="property-row">
                <span class="property-label">Name</span>
                <span class="property-value" id="cluster-name"></span>
            </div>

            <div class="property-row">
                <span class="property-label">URL</span>
                <span class="property-value" id="cluster-url"></span>
            </div>

            <div class="property-row">
                <span class="property-label">Environment</span>
                <span class="property-value" id="cluster-environment"></span>
            </div>

    </div>

    <br>

    <div class="cluster-actions"><button id="connect-btn" class="form-button form-button-save">Connect</button></div>

        <div id="cluster-delete-confirmation" class="cluster-delete-confirmation" style="display:none;">

            <div class="delete-confirmation-header">⚠ Delete Cluster</div>

            <div class="delete-confirmation-text">
                You are about to permanently remove: 
                
                <strong id="delete-cluster-name"></strong>
                <br>
                This action cannot be undone.
            </div>

            <div class="delete-confirmation-actions">
                <button id="confirm-delete-btn" class="form-button-delete">Delete Cluster</button>
                <button id="cancel-delete-btn" class="form-button">Cancel</button>               
            </div>
    </div>

</div>
