<div class="property-box" id="node-history-properties">

   
        <h2>Node History</h2>
        <br>
        <p><strong>Node:</strong> <span id="node-history-name"></span></p>
        <p><strong>Current Usage:</strong> <span id="node-current-usage"></span></p>
        <p><strong>Disk Status:</strong> <span id="node-current-status"></span></p>
        <p><strong>Total Events:</strong> <span id="node-total-events"></span></p>
        <p><strong>Availability:</strong> <span id="node-availability"></span></p>
        <p><strong>Trend:</strong> <span id="node-trend">-</span></p>
    
    <br>
    <hr>
    <br>
    <div class="history-filter-container">
        <label>Time Period:</label>
        <select id="node-period" class="history-filter">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>
    <br>

    <h3>Node Usage History</h3>
    <div style="height:400px;"><canvas id="nodeHistoryChart"></canvas></div>
    <br>
    <hr>
    <br>
    <h3>Recent Events</h3>
    <br>
    <div class="history-events-box">

        <div class="event-header">
            <span>Timestamp</span>
            <span>Usage</span>
            <span>Event</span>
        </div>
    
        <div id="node-events"></div>
    </div>

</div>
