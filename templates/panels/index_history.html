<div class="property-box" id="index-history-properties">

    <h2>Index Growth History</h2>

    <br>

    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-title">Index</div>
            <div class="metric-value" id="index-history-name"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Documents</div>
            <div class="metric-value" id="index-current-docs"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Size</div>
            <div class="metric-value" id="index-current-size"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Current Disk Status</div>
            <div class="metric-value" id="index-current-status"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Total Events</div>
            <div class="metric-value" id="index-total-events"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Documents Trend</div>
            <div class="metric-value" id="index-docs-trend"></div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Storage Trend</div>
            <div class="metric-value" id="index-size-trend"></div>
        </div>

    </div>

    <hr>

    <br>

    <div class="history-filter-container">
        <label>Time Period:</label>

        <select id="index-period" class="history-filter">
            <option value="1h">Last Hour</option>
            <option value="24h" selected>Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="365d">Last 365 Days</option>
        </select>
    </div>

    <br>

    <h3>Document Growth</h3>

    <div style="height:400px;">
        <canvas id="indexDocsChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Storage Growth</h3>

    <div style="height:400px;">
        <canvas id="indexSizeChart"></canvas>
    </div>

    <br>

    <hr>

    <br>

    <h3>Recent Events</h3>

    <br>

    <div class="history-events-box">

        <div id="index-event-header">
            <span>Timestamp</span>
            <span>Documents</span>
            <span>Size</span>
            <span>Event</span>
        </div>

        <div id="index-events"></div>

    </div>

</div>
