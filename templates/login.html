<!DOCTYPE html>
<html>

<head>
    <title>Elastic Monitor Login Page</title>
</head>

<body>

    <h1>Elastic Monitor</h1>

    <form method="post">

        {% csrf_token %}

        <p>
            Username:
            <input type="text" name="username">
        </p>

        <p>
            Password:
            <input type="password" name="password">
        </p>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p style="color:red;">
            Wrong username or password
        </p>
    {% endif %}

<script> /*Βαζω λίγο javascript,για να εξαφανίζει το error msg όταν γίνεται σωστό Login*/
const errorMsg = document.getElementById("error-message");

if(errorMsg){

    document.getElementById("username").addEventListener("input", () => {
        errorMsg.style.display = "none";
    });

    document.getElementById("password").addEventListener("input", () => {
        errorMsg.style.display = "none";
    });

}
</script>

</body>

</html>
